version: '3.8'

services:
  musicdl:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: musicdl:latest
    container_name: musicdl-web
    restart: unless-stopped
    dns:
      - 223.5.5.5
      - 119.29.29.29
      - 8.8.8.8
    ports:
      # 推荐仅绑定本地 127.0.0.1，前端交由 OpenResty 反向代理
      # 如需直接外网访问，可改为 "5050:5050"
      - "127.0.0.1:5050:5050"
    volumes:
      # 持久化保存下载的音乐和缓存数据
      - ./downloads:/app/downloads
      # 前端静态资源直接映射宿主机：Dockerfile 里是 COPY . .，
      # 不挂载的话改了 HTML/CSS/JS 必须 --build 才会进容器（git pull 只改了宿主机）
      - ./musicdl/web/static:/app/musicdl/web/static:ro
    environment:
      - TZ=Asia/Shanghai
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
